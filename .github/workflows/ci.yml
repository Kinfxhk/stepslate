# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + property + golden tests
        run: npm test

      - name: Dependency licence check (AGPL-3.0 compatible allowlist)
        run: npm run check:licenses

      - name: Repository hygiene (notices, no external loads, no competitor branding)
        run: npm run check:hygiene

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -O "${base}/${tarball}"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${tarball}"

      - name: Secret scan
        run: npm run check:secrets

  windows:
    # Students and teachers often run the offline copy on Windows: check that the code,
    # tests, build and CLI behave the same there (paths, line endings, Unicode input).
    # The secret scan and Docker build run on Linux only.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (LF line endings via .gitattributes)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + property + golden tests
        run: npm test

      - name: Repository hygiene
        run: npm run check:hygiene

      - name: Build the web app
        run: npm run build

      - name: CLI smoke test (full-width input, node.exe called directly so no cmd.exe quoting)
        shell: pwsh
        run: |
          $out = node --import tsx packages/cli/src/solve.ts "２(x+3)=5x−4" | Out-String
          Write-Output $out
          if ($out -notmatch 'x = 10/3') { throw 'CLI did not print x = 10/3' }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (solve flow, language, offline, no external requests, axe-core)
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: docker build --pull -t sumstair:ci .

      - name: Run container and wait for the health endpoint
        run: |
          set -euo pipefail
          docker run -d --name sumstair-ci -p 127.0.0.1:4873:4873 sumstair:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4873/healthz; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time." >&2
          docker logs sumstair-ci >&2
          exit 1

      - name: Home page is served (HTTP 200)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4873/)
          echo "HTTP $code"
          test "$code" = 200

      - name: Container logs
        if: always()
        run: docker logs sumstair-ci || true
