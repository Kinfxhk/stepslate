# Field ids (problem, shown, version) are filled in by the app's "Report a wrong answer"
# link (packages/web/src/report.ts). Keep them in sync.
name: Wrong answer or wrong step
description: StepSlate showed a step or an answer that is wrong (or refused a problem it should solve).
title: 'Wrong answer: '
labels: ['wrong answer']
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Every wrong answer we fix gets a regression test, so it stays fixed.
        Please do **not** paste problems copied from textbooks, exam papers or other apps:
        describe the problem in your own words or change the numbers.
  - type: input
    id: problem
    attributes:
      label: Problem as typed
      description: Exactly what you typed into StepSlate.
      placeholder: 2(x+3)=5x-4
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What StepSlate showed
      description: The steps or message (filled in automatically when you use the link in the app).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
      description: Which step is wrong? What should it be? Working is welcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the page footer, for example v0.1.0.
      placeholder: v0.1.0
  - type: dropdown
    id: where
    attributes:
      label: Where did you use it?
      options:
        - Website (GitHub Pages)
        - Offline zip / self-hosted
        - Docker
        - Command line (npm run solve)
        - Other
